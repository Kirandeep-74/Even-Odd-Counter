<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightgray;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: black;
        }

        input {
            width: 200px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #box {
            width: 250px;
            height: 100px;
            margin: 25px auto;
            border: 2px solid black;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Even Odd Checker</h2>

    <input type="number" id="num" placeholder="Enter a number">

    <br><br>

    <button onclick="check()">Check</button>

    <div id="box">Result</div>

</div>
<script>

function check() {

    let n = Number(document.getElementById("num").value);

    let box = document.getElementById("box");

    if (n % 2 == 0) {

        box.innerHTML = "Even Number";
        box.style.backgroundColor = "green";

    }
    else {

        box.innerHTML = "Odd Number";
        box.style.backgroundColor = "red";

    }
}

</script>

</body>
</html>
